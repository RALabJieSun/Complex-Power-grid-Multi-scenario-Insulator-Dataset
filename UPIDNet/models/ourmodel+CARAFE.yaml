# YOLOv5 🚀 by Ultralytics, GPL-3.0 license

# Parameters
nc: 3  # number of classes
depth_multiple: 1  # model depth multiple
width_multiple: 1  # layer channel multiple
anchors:
  - [4,5, 8,10, 22,18] # P2/4
  - [10,13, 16,30, 33,23]  # P3/8
  - [30,61, 62,45, 59,119]  # P4/16
  - [116,90, 156,198, 373,326]  # P5/32

# YOLOv5 v6.0 backbone
backbone:
  # [from, number, module, args]
  [[-1, 1, Conv, [64, 6, 2, 2]],  # 0-P1/2
   [-1, 1, Conv, [128, 3, 2]],  # 1-P2/4
   [-1, 3, C3, [128]],
   [-1, 1, Conv, [256, 3, 2]],  # 3-P3/8
   [-1, 6, C3, [256]],
   [-1, 1, Conv, [512, 3, 2]],  # 5-P4/16
   [-1, 9, C3, [512]],
   [-1, 1, Conv, [1024, 3, 2]],  # 7-P5/32
   [-1, 3, C3CoTA, [1024]],
   [-1, 1, SPPF, [1024, 5]],  # 9
  ]

# YOLOv5 v6.0 head
head:
  [
   [-1, 1, Conv, [512, 1, 1]],            # 10
   [4, 1, Conv, [512, 1, 1]],             # 11
   [[-1, 6, -2], 1, Zoom_cat, [512]],     # 12 cat backbone P4
   [-1, 3, C3, [512, False]],             # 13

   [-1, 1, Conv, [256, 1, 1]],            # 14
   [2, 1, Conv, [256, 1, 1]],             # 15
   [[-1, 4, -2], 1, Zoom_cat, [256]],     # 16 cat backbone P3

   # add feature extration layer 
   [-1, 3, C3, [256, False]],             # 17
   [-1, 1, Conv, [256, 1, 1]],            # 18
   [-1, 1, CARAFE, [3, 5]],               # 19
   [[-1, 2], 1, Concat, [1]],             # 20 cat backbone P2

   # add detect layer
   [-1, 3, C3, [256, False]],             # 21 (P2/4-minium)

   [-1, 1, Conv, [256, 3, 2]],            # 22
   [[-1, 18], 1, Concat, [1]],            # 23 cat head P3
   # end

   [-1, 3, C3, [512, False]],             # 24 (P3/8-small)

   [-1, 1, Conv, [256, 3, 2]],            # 25 
   [[-1, 14], 1, Concat, [1]],            # 26 cat head P4
   [-1, 3, C3, [256, False]],             # 27 (P4/16-medium)

   [-1, 1, Conv, [512, 3, 2]],            # 28
   [[-1, 10], 1, Concat, [1]],            # 29 cat head P5
   [-1, 3, C3, [1024, False]],            # 30 (P5/32-large)

   [[4, 6, 8], 1, ScalSeq, [256]],        # 31 
   [[17, -1], 1, CPAM, [256]],            # 32

   [[-1, 24, 27, 30], 1, Detect, [nc, anchors]],  # Detect(P2, P3, P4, P5)
  ]

